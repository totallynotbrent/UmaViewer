name: Build and release Windows IL2CPP

on:
  push:
    tags:
      - "v*"
    branches:
      - "master"
      - "experimental"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional release tag, for example v1.0.0 (leave empty for build only)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: unity-windows-il2cpp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows x64 IL2CPP
    # IL2CPP for Windows requires the windows-il2cpp Unity image, which per GameCI
    # can only run on a Windows runner (Mono-only builds worked on Linux, but that
    # is not IL2CPP and could not import the packed CySpringPlugin.dll).
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Verify Unity license secrets
        shell: pwsh
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          $missing = @()
          if ([string]::IsNullOrWhiteSpace($env:UNITY_EMAIL)) { $missing += "UNITY_EMAIL" }
          if ([string]::IsNullOrWhiteSpace($env:UNITY_PASSWORD)) { $missing += "UNITY_PASSWORD" }
          if ($missing.Count -gt 0) {
            Write-Error "Missing repository secrets: $($missing -join ', '). Personal license needs only UNITY_EMAIL + UNITY_PASSWORD (serial optional for Plus/Pro). See .github/UNITY_LICENSE_SETUP.md."
            exit 1
          }

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          # Stable key (no Assets/** hash): the Library holds Unity's asset import
          # cache, which is additive and safe to reuse across code churn. Hashing
          # Assets/** made every code change produce a fresh key -> full cold
          # re-import on every push. Unity reconciles stale imports incrementally.
          key: Library-${{ runner.os }}-StandaloneWindows64
          restore-keys: |
            Library-${{ runner.os }}-StandaloneWindows64

      - name: Cache IL2CPP incremental build (Bee)
        uses: actions/cache@v4
        with:
          # The bee C++ object cache lives under Library/bee_cache (unity-builder sets
          # BEE_CACHE_DIRECTORY there). Persisting it across runs is what enables IL2CPP
          # incremental builds — without it the tool recompiles every generated .cpp each
          # push (the ~26 min cost). Keyed WITHOUT the Assets/** hash so it survives code
          # churn; only the target + OS invalidate it.
          path: |
            Library/bee_cache
          key: il2cpp-bee-${{ runner.os }}-StandaloneWindows64
          restore-keys: |
            il2cpp-bee-${{ runner.os }}-StandaloneWindows64

      - name: Free disk space (IL2CPP Windows editor image is large)
        if: runner.os == 'Linux'
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          large-packages: true
          swap-storage: false

      - name: Generate build commit stamp
        shell: pwsh
        run: |
          $sha = $env:GITHUB_SHA
          $short = $sha.Substring(0, 7)
          $content = "public static class BuildCommit { public const string Sha = `"$short`"; }"
          Set-Content -Path "Assets/Scripts/BuildCommit.cs" -Value $content -Encoding UTF8

      - name: Build Windows player with IL2CPP
        # v4.8.0+ includes the vcredist2013 activation fix (PR #757) — without it the
        # Windows container hits "CreateDirectory ...\Unity\Caches failed" + exit 199
        # (license activation failure). Pin it rather than @v4 to avoid the flake.
        uses: game-ci/unity-builder@v4.8.2
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 2022.3.62f2
          targetPlatform: StandaloneWindows64
          buildName: UmaViewer
          buildsPath: build
          # the commit-stamp step writes BuildCommit.cs, which dirties the tree; Semantic
          # versioning refuses a dirty branch, so allow it explicitly.
          allowDirtyBuild: true
          # Semantic derives Application.version from the git tag (v1.3.0 -> 1.3.0)
          # so the exe reports the same version as the GitHub release, instead of the
          # stale bundleVersion 2.1.34 the old Custom scheme inherited from upstream.
          versioning: Semantic

      - name: Package Windows build
        shell: pwsh
        run: |
          Copy-Item "update.bat" "build/StandaloneWindows64/update.bat" -Force
          Get-ChildItem -Path "build/StandaloneWindows64" -Exclude "UmaViewer_BackUpThisFolder_ButDontShipItWithYourGame","GameAssembly.pdb" | Compress-Archive -DestinationPath "UmaViewer-Windows-x64.zip" -Force

      - name: Write release digest
        shell: pwsh
        run: |
          # sidecar for installs that want to verify the release before installing.
          $hash = Get-FileHash "UmaViewer-Windows-x64.zip" -Algorithm SHA256
          ("{0}  UmaViewer-Windows-x64.zip" -f $hash.Hash.ToLower()) | Set-Content -Path "UmaViewer-Windows-x64.zip.sha256" -Encoding ascii

      - name: Upload workflow artifact (single clean zip of the build)
        uses: actions/upload-artifact@v4
        with:
          name: UmaViewer-Windows-x64
          path: build/StandaloneWindows64
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/experimental' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          if [[ "$GITHUB_REF" == refs/heads/experimental ]]; then
            # single rolling prerelease named after the branch; each push replaces the prior one.
            NAME="experimental"
            # delete any prior rolling release for this tag so assets don't accumulate
            gh release delete "$NAME" --yes --cleanup-tag 2>/dev/null || true
            # change note = the latest real viewer change on the branch; commits that only
            # touch .github/workflows are skipped so a workflow tweak is never the visible note.
            BASE="$(git merge-base origin/master HEAD)"
            NOTE="$(git log --format='%s' "$BASE"..HEAD -- ':!.github/workflows' | head -1)"
            [ -z "$NOTE" ] && NOTE="windows x64 il2cpp build."
            gh release create "$NAME" \
              "UmaViewer-Windows-x64.zip#UmaViewer Windows x64 (IL2CPP)" \
              "UmaViewer-Windows-x64.zip.sha256#SHA-256 digest" \
              --target "$GITHUB_SHA" \
              --title "UmaViewer $NAME" \
              --prerelease \
              --notes "$NOTE"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # stable release: the tag message is the single-sentence change note.
            gh release create "$RELEASE_TAG" \
              "UmaViewer-Windows-x64.zip#UmaViewer Windows x64 (IL2CPP)" \
              "UmaViewer-Windows-x64.zip.sha256#SHA-256 digest" \
              --target "$GITHUB_SHA" \
              --title "UmaViewer $RELEASE_TAG" \
              --notes-from-tag
          else
            # manual dispatch with a custom tag: no tag message exists yet, so
            # use a plain one-liner and set the real note by editing the release.
            gh release create "$RELEASE_TAG" \
              "UmaViewer-Windows-x64.zip#UmaViewer Windows x64 (IL2CPP)" \
              "UmaViewer-Windows-x64.zip.sha256#SHA-256 digest" \
              --target "$GITHUB_SHA" \
              --title "UmaViewer $RELEASE_TAG" \
              --notes "windows x64 il2cpp build."
          fi
