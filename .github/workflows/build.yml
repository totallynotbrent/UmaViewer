name: Build and release Windows IL2CPP

on:
  # NOTE: auto-builds disabled to stop burning Actions minutes (2026-09-10).
  # To re-enable, uncomment the push / pull_request block below. Only manual
  # workflow_dispatch remains so a build can still be fired on demand.
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional release tag, for example v1.0.0 (leave empty for build only)"
        required: false
        type: string
  # push:
  #   tags:
  #     - "v*"
  #   branches:
  #     - "prerelease/*"
  # pull_request:

permissions:
  contents: write

concurrency:
  group: unity-windows-il2cpp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows x64 IL2CPP
    # IL2CPP for Windows requires the windows-il2cpp Unity image, which per GameCI
    # can only run on a Windows runner (Mono-only builds worked on Linux, but that
    # is not IL2CPP and could not import the packed CySpringPlugin.dll).
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Verify Unity license secrets
        shell: pwsh
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          $missing = @()
          if ([string]::IsNullOrWhiteSpace($env:UNITY_EMAIL)) { $missing += "UNITY_EMAIL" }
          if ([string]::IsNullOrWhiteSpace($env:UNITY_PASSWORD)) { $missing += "UNITY_PASSWORD" }
          if ($missing.Count -gt 0) {
            Write-Error "Missing repository secrets: $($missing -join ', '). Personal license needs only UNITY_EMAIL + UNITY_PASSWORD (serial optional for Plus/Pro). See .github/UNITY_LICENSE_SETUP.md."
            exit 1
          }

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-StandaloneWindows64-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ runner.os }}-StandaloneWindows64-

      - name: Cache IL2CPP incremental build (Bee)
        uses: actions/cache@v4
        with:
          # The bee C++ object cache lives under Library/bee_cache (unity-builder sets
          # BEE_CACHE_DIRECTORY there). Persisting it across runs is what enables IL2CPP
          # incremental builds — without it the tool recompiles every generated .cpp each
          # push (the ~26 min cost). Keyed WITHOUT the Assets/** hash so it survives code
          # churn; only the target + OS invalidate it.
          path: |
            Library/bee_cache
          key: il2cpp-bee-${{ runner.os }}-StandaloneWindows64
          restore-keys: |
            il2cpp-bee-${{ runner.os }}-StandaloneWindows64

      - name: Free disk space (IL2CPP Windows editor image is large)
        if: runner.os == 'Linux'
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          large-packages: true
          swap-storage: false

      - name: Build Windows player with IL2CPP
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          VERSION: 1.1.0.${{ github.run_number }}
        with:
          projectPath: .
          unityVersion: 2022.3.62f2
          targetPlatform: StandaloneWindows64
          buildName: UmaViewer
          buildsPath: build
          versioning: Custom

      - name: Package Windows build
        shell: pwsh
        run: |
          Get-ChildItem -Path "build/StandaloneWindows64" -Exclude "UmaViewer_BackUpThisFolder_ButDontShipItWithYourGame" | Compress-Archive -DestinationPath "UmaViewer-Windows-x64.zip" -Force

      - name: Upload workflow artifact (single clean zip of the build)
        uses: actions/upload-artifact@v4
        with:
          name: UmaViewer-Windows-x64
          path: build/StandaloneWindows64
          if-no-files-found: error
          retention-days: 14
          compression-level: 9

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            "UmaViewer-Windows-x64.zip#UmaViewer Windows x64 (IL2CPP)" \
            --target "$GITHUB_SHA" \
            --title "UmaViewer $RELEASE_TAG" \
            --notes "Windows x64 IL2CPP build. For release notes, see the commit history or docs."

      - name: Publish GitHub Pre-release (prerelease/* branch)
        if: startsWith(github.ref, 'refs/heads/prerelease/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH_SUFFIX="${{ github.ref_name }}"
          # prerelease/cyspring-hair-fix -> cyspring-hair-fix
          TAG="pre-${BRANCH_SUFFIX##*/}"
          ZIP="UmaViewer-Windows-x64.zip"
          # delete any prior rolling prerelease for this tag so assets don't accumulate
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            "$ZIP#UmaViewer prerelease ($BRANCH_SUFFIX)" \
            --target "$GITHUB_SHA" \
            --title "UmaViewer pre ($BRANCH_SUFFIX)" \
            --prerelease \
            --notes "Windows x64 IL2CPP prerelease build. Tracked work lives on the $BRANCH_SUFFIX branch."
